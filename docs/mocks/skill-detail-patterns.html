<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>モック: B案（順位＋チップ）</title>
  <style>
    :root {
      --ink: #3d3860;
      --muted: #6b6588;
      --line: #e4dfeb;
      --bg: #f4f1f7;
      --card: #fff;
      --row: #f5f3f8;
      --front: #3f6a62;
      --front-bg: #e8f1ee;
      --back: #8d6a3d;
      --back-bg: #f4ecdf;
      --other: #5a5288;
      --other-bg: #eceaf4;
      --x: #8d5a5f;
      --x-bg: #f4ecec;
      --on: #3d9a4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Segoe UI", "Hiragino Sans", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 1rem 1.1rem 0.6rem;
      max-width: 980px;
      margin: 0 auto;
    }
    h1 { font-size: 1.15rem; margin: 0 0 0.35rem; }
    .lead { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.85rem 0 0.5rem;
    }
    .controls button {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
    }
    .controls button.is-on {
      background: var(--ink);
      color: #fff;
      border-color: transparent;
    }
    .note {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    .stage-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 1rem 2.5rem;
    }
    .stage {
      background: var(--card);
      border-radius: 16px;
      padding: 0.85rem;
      box-shadow: 0 8px 28px rgba(50, 40, 80, 0.08);
      margin-inline: auto;
    }
    .stage[data-width="phone"] { width: min(390px, 100%); }
    .stage[data-width="tablet"] { width: min(720px, 100%); }

    .row {
      display: grid;
      grid-template-columns: 1.6rem minmax(0, 1fr) auto 4.4rem 5.8rem 1.75rem;
      align-items: center;
      gap: 0.35rem;
      padding: 0.42rem 0.4rem;
      border-radius: 8px;
      background: var(--row);
      cursor: pointer;
    }
    .row + .row, .block + .row { margin-top: 0.28rem; }
    .rank { color: #8a84a3; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
    .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
    .unit { margin-left: 0.12em; font-size: 0.65rem; font-weight: 500; color: var(--muted); }
    .x {
      width: 1.75rem; height: 1.75rem; border-radius: 999px; border: 1px solid #e4d4d5;
      background: var(--x-bg); color: var(--x); font-size: 1.05rem; cursor: pointer;
    }
    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.12rem 0.4rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge--front { color: var(--front); background: var(--front-bg); }
    .badge--back { color: var(--back); background: var(--back-bg); }
    .badge--other { color: var(--other); background: var(--other-bg); }
    .badge-slot { min-width: 2.4rem; }
    .block {
      background: #fbfafc;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 8px 8px;
      padding: 0.7rem 0.75rem 0.8rem;
      margin-top: -0.15rem;
      font-size: 0.86rem;
    }
    .row.is-open { border-radius: 8px 8px 0 0; }
    .desc { margin: 0.45rem 0 0; white-space: pre-line; color: var(--ink); }
    .hint-row { font-size: 0.75rem; color: var(--muted); margin: 0.35rem 0 0.8rem; }

    .cm-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem 0.55rem;
      margin-bottom: 0.45rem;
    }
    .cm-label {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.12rem 0.4rem;
      border-radius: 999px;
      background: #eeeae2;
      color: #5c5346;
    }
    .cm-text { font-size: 0.88rem; font-weight: 650; }
    .cm-dots {
      display: flex;
      gap: 0.22rem;
      flex-wrap: nowrap;
    }
    .cm-dot {
      width: 1.28rem;
      height: 1.28rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.62rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: #efece6;
      color: #6a6258;
      flex: 0 0 auto;
    }
    .cm-dot.is-on {
      background: var(--on);
      color: #fff;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .chip {
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
    }
    .chip--effect { background: #e7eef8; color: #3d5278; }
    .chip--phase { background: #ece8f3; color: #534a72; }
    .chip--apt { background: #e8f0ea; color: #3d5c48; }
  </style>
</head>
<body>
  <header>
    <h1>B案モック — 順位の出し方と比較</h1>
    <p class="lead">
      本体未接続。行タップで詳細。折りたたみ行のバッジは条件があるときだけ（前 / 中後 / その他）。
      1〜9の色付けは<strong>詳細の中だけ</strong>に置いてあります（閉じた行に9個並べると名前が潰れるため）。
    </p>
    <div class="controls" id="rank-btns">
      <button type="button" data-rank="dots" class="is-on">詳細: 1〜9の色付け</button>
      <button type="button" data-rank="text">詳細: 4位〜9位の文字</button>
    </div>
    <div class="controls" id="width-btns">
      <button type="button" data-width="phone" class="is-on">幅 390（スマホ）</button>
      <button type="button" data-width="tablet">幅 720</button>
    </div>
    <p class="note" id="pattern-note"></p>
  </header>
  <div class="stage-wrap">
    <div class="stage" id="stage" data-width="phone"></div>
  </div>

  <script>
    /* チャンミ9頭換算: order_rate と 100*順位/9 の比較（U-tools の 4位〜9位 に合わせた概算） */
    const SKILLS = [
      {
        name: "余勢を駆って",
        basha: "1.27",
        pt: "1.06",
        badge: null,
        desc: "上り坂で速度がわずかに上がる\n＜作戦・先行＞",
        cm: null,
        effects: ["速度"],
        phases: ["上り坂"],
        apts: ["先行"],
      },
      {
        name: "真っ向勝負",
        basha: "0.93",
        pt: "0.52",
        badge: "前",
        badgeKind: "front",
        desc: "レース終盤始めの方で前方にいると\n加速力がわずかに上がる＜作戦・先行＞",
        cm: { from: 1, to: 4 },
        effects: ["加速"],
        phases: ["終盤始め"],
        apts: ["先行"],
      },
      {
        name: "ワンチャンス",
        basha: "0.93",
        pt: "0.52",
        badge: "中後",
        badgeKind: "back",
        desc: "レース終盤始めの方で中団以降にいると\n加速力がわずかに上がる＜中距離＞",
        cm: { from: 4, to: 9 },
        effects: ["加速"],
        phases: ["終盤始め"],
        apts: ["中距離"],
      },
      {
        name: "急襲",
        basha: "0.71",
        pt: "0.39",
        badge: "中後",
        badgeKind: "back",
        desc: "レース終盤始めの方に中団以降にいると\nわずかに前に出る＜中距離/長距離＞",
        cm: { from: 4, to: 9 },
        effects: ["現在速度"],
        phases: ["終盤始め"],
        apts: ["中距離", "長距離"],
      },
      {
        name: "会心の一歩",
        basha: "1.17",
        pt: "0.65",
        badge: "その他",
        badgeKind: "other",
        desc: "終盤以降の最終コーナーで\n中団以前にいる時ゴールまで遠いと\n加速力がわずかに上がる＜先行/差し＞",
        cm: { from: 1, to: 6 },
        effects: ["加速"],
        phases: ["終盤以降", "最終コーナー", "ゴールまで遠い"],
        apts: ["先行", "差し"],
      },
      {
        name: "闘争心",
        basha: "0.55",
        pt: "0.31",
        badge: "中後",
        badgeKind: "back",
        desc: "レース中盤に中団で競り合うと\n持久力がちょっと回復し\n速度がわずかに上がる＜中距離＞",
        cm: { from: 5, to: 9 },
        effects: ["回復", "速度"],
        phases: ["中盤"],
        apts: ["中距離"],
      },
    ];

    let rankMode = "dots";
    let openId = 2;
    const stage = document.getElementById("stage");
    const noteEl = document.getElementById("pattern-note");

    function badgeHtml(s) {
      if (!s.badge) return '<span class="badge-slot"></span>';
      return `<span class="badge badge--${s.badgeKind}">${s.badge}</span>`;
    }

    function dotsHtml(cm) {
      let html = '<div class="cm-dots" aria-label="チャンミ9頭の順位">';
      for (let n = 1; n <= 9; n++) {
        const on = n >= cm.from && n <= cm.to;
        html += `<span class="cm-dot${on ? " is-on" : ""}">${n}</span>`;
      }
      return html + "</div>";
    }

    function rankBlock(s) {
      if (!s.cm) return "";
      if (rankMode === "text") {
        return `<div class="cm-line">
          <span class="cm-label">チャンミ条件</span>
          <span class="cm-text">${s.cm.from}位 〜 ${s.cm.to}位</span>
        </div>`;
      }
      return `<div class="cm-line">${dotsHtml(s.cm)}</div>`;
    }

    function chipsHtml(s) {
      const parts = [
        ...s.effects.map((t) => `<span class="chip chip--effect">${t}</span>`),
        ...s.phases.map((t) => `<span class="chip chip--phase">${t}</span>`),
        ...s.apts.map((t) => `<span class="chip chip--apt">${t}</span>`),
      ];
      return `<div class="chips">${parts.join("")}</div>`;
    }

    function detail(s) {
      return `<div class="block">
        ${rankBlock(s)}
        ${chipsHtml(s)}
        <p class="desc">${s.desc}</p>
      </div>`;
    }

    function render() {
      noteEl.textContent =
        rankMode === "dots"
          ? "詳細先頭が 1〜9。円は直径約20px。390幅の内側でも1行に収まります。閉じた行には置きません。"
          : "詳細先頭が「チャンミ条件 4位 〜 9位」。幅は取らないが、何番が有効かは数字を読む必要がある。";
      stage.innerHTML =
        `<p class="hint-row">チップ順: 順位（上）→ 効果 → 局面 → 脚質/距離。行をタップ</p>` +
        SKILLS.map((s, i) => {
          const open = openId === i;
          return `<div class="row${open ? " is-open" : ""}" data-i="${i}">
            <span class="rank">${i + 1}</span>
            <span class="name">${s.name}</span>
            ${badgeHtml(s)}
            <span class="stat">${s.basha}<span class="unit">[バ]</span></span>
            <span class="stat">${s.pt}<span class="unit">[バ/Pt]</span></span>
            <button type="button" class="x" aria-label="外す" data-x>×</button>
          </div>${open ? detail(s) : ""}`;
        }).join("");
    }

    stage.addEventListener("click", (e) => {
      if (e.target.closest("[data-x]")) return;
      const row = e.target.closest("[data-i]");
      if (!row) return;
      const i = Number(row.dataset.i);
      openId = openId === i ? null : i;
      render();
    });
    document.getElementById("rank-btns").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-rank]");
      if (!btn) return;
      rankMode = btn.dataset.rank;
      document.querySelectorAll("#rank-btns button").forEach((b) =>
        b.classList.toggle("is-on", b === btn)
      );
      if (openId == null) openId = 2;
      render();
    });
    document.getElementById("width-btns").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-width]");
      if (!btn) return;
      stage.dataset.width = btn.dataset.width;
      document.querySelectorAll("#width-btns button").forEach((b) =>
        b.classList.toggle("is-on", b === btn)
      );
    });
    render();
  </script>
</body>
</html>
