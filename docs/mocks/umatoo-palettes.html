<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>モック: UmaTools寄せの色</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font: "Zen Maru Gothic", Meiryo, sans-serif;
      --doc: #121018;
      --doc-muted: #a8a0b4;
      --gold: #f5cf6f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--doc);
      color: #f4f0e8;
      line-height: 1.5;
    }
    a { color: var(--gold); }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 1.1rem 1rem 3rem; }
    h1 { font-size: 1.2rem; margin: 0 0 0.3rem; font-weight: 900; }
    .lead { margin: 0 0 1rem; color: var(--doc-muted); font-size: 0.88rem; }
    .grid {
      display: grid;
      gap: 1rem;
    }
    @media (min-width: 1100px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    figure { margin: 0; }
    figcaption {
      font-size: 0.84rem;
      font-weight: 700;
      margin: 0 0 0.4rem;
      color: var(--gold);
    }
    figcaption span {
      display: block;
      font-weight: 500;
      color: var(--doc-muted);
      font-size: 0.75rem;
      margin-top: 0.12rem;
    }
    .frame {
      border: 1px solid #3a3448;
      border-radius: 14px;
      overflow: hidden;
      min-height: 520px;
      background: var(--page);
      color: var(--text);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      background: var(--nav);
      border-bottom: 1px solid var(--nav-line);
      color: var(--nav-text);
    }
    .nav h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.03em;
    }
    .nav h2 em { font-style: normal; color: var(--accent); }
    .help {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.28rem 0.7rem;
      border: 1px solid var(--ghost-line);
      background: transparent;
      color: var(--nav-text);
      cursor: default;
    }
    .main {
      padding: 0.9rem 1rem 1.15rem;
      display: grid;
      gap: 0.7rem;
      background: var(--page);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-line);
      border-radius: 14px;
      padding: 0.8rem 0.9rem;
      box-shadow: var(--card-shadow);
    }
    .card h3 {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      display: inline-block;
      border-bottom: 3px solid var(--accent);
      padding-bottom: 0.1rem;
      color: var(--text);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .chip {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--chip-line);
      background: var(--chip);
      color: var(--chip-text);
    }
    .chip.on {
      background: var(--chip-on);
      color: var(--chip-on-text);
      border-color: transparent;
    }
    .row {
      display: flex;
      justify-content: space-between;
      background: var(--row);
      border: 1px solid var(--row-line);
      border-radius: 8px;
      padding: 0.4rem 0.55rem;
      margin-top: 0.28rem;
      font-size: 0.8rem;
    }
    .copy {
      margin-top: 0.5rem;
      width: 100%;
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 10px;
      padding: 0.5rem;
      background: var(--cta);
      color: #fff;
    }

    /* 1 夜の金ピンク — いまのB */
    [data-theme="night"] {
      --page: #14101c;
      --nav: rgba(16, 12, 24, 0.85);
      --nav-line: rgba(255,255,255,.06);
      --nav-text: #f1f5f9;
      --text: #f1f5f9;
      --accent: #f5cf6f;
      --cta: #ff3276;
      --card: rgba(255,255,255,.045);
      --card-line: rgba(255,255,255,.08);
      --card-shadow: none;
      --chip: rgba(0,0,0,.22);
      --chip-line: rgba(255,255,255,.12);
      --chip-text: #ddd8ef;
      --chip-on: #f5cf6f;
      --chip-on-text: #3a2a00;
      --row: rgba(0,0,0,.22);
      --row-line: rgba(255,255,255,.05);
      --ghost-line: rgba(255,255,255,.18);
    }
    [data-theme="night"] .frame,
    .frame[data-theme="night"] {
      background:
        radial-gradient(800px 360px at 8% -20%, rgba(255,50,118,.13), transparent 50%),
        radial-gradient(700px 320px at 100% 0%, rgba(245,207,111,.1), transparent 48%),
        #14101c;
    }

    /* 2 明るい計算機 */
    [data-theme="calc"] {
      --page: #f4f0ea;
      --nav: #fffaf4;
      --nav-line: rgba(70,63,112,.12);
      --nav-text: #463f70;
      --text: #703a13;
      --accent: #c9a024;
      --cta: #ff3276;
      --card: #ffffff;
      --card-line: rgba(70,63,112,.1);
      --card-shadow: 0 4px 14px rgba(26,36,51,.07);
      --chip: #fff;
      --chip-line: #ddd6e8;
      --chip-text: #463f70;
      --chip-on: #463f70;
      --chip-on-text: #fff;
      --row: #f5f3f8;
      --row-line: transparent;
      --ghost-line: rgba(70,63,112,.22);
    }

    /* 3 暗い帽子＋白い机 */
    [data-theme="hybrid"] {
      --page: #f3eef6;
      --nav: #1a1628;
      --nav-line: transparent;
      --nav-text: #f8fafc;
      --text: #703a13;
      --accent: #c9a024;
      --cta: #ff3276;
      --card: #ffffff;
      --card-line: rgba(70,63,112,.1);
      --card-shadow: 0 4px 14px rgba(26,36,51,.08);
      --chip: #fff;
      --chip-line: #ddd6e8;
      --chip-text: #463f70;
      --chip-on: #463f70;
      --chip-on-text: #fff;
      --row: #f5f3f8;
      --row-line: transparent;
      --ghost-line: rgba(255,255,255,.28);
    }
    [data-theme="hybrid"] .nav h2 em { color: #f5cf6f; }
    [data-theme="hybrid"] .card h3 { border-bottom-color: #f5cf6f; color: #463f70; }

    /* 4 暖色の夜 — 因子・紙の比喩 */
    [data-theme="warm"] {
      --page: #1a1410;
      --nav: rgba(28, 20, 14, 0.9);
      --nav-line: rgba(245,207,111,.12);
      --nav-text: #fff8e8;
      --text: #fff4e4;
      --accent: #e8c36a;
      --cta: #e24b3c;
      --card: rgba(255, 236, 210, .06);
      --card-line: rgba(232,195,106,.16);
      --card-shadow: none;
      --chip: rgba(0,0,0,.28);
      --chip-line: rgba(232,195,106,.22);
      --chip-text: #f0e0c4;
      --chip-on: #e8c36a;
      --chip-on-text: #3a2a00;
      --row: rgba(0,0,0,.28);
      --row-line: rgba(232,195,106,.1);
      --ghost-line: rgba(232,195,106,.35);
    }
    .frame[data-theme="warm"] {
      background:
        radial-gradient(820px 380px at 90% -10%, rgba(232,195,106,.16), transparent 52%),
        #1a1410;
    }

    .note { color: var(--doc-muted); font-size: 0.8rem; margin: 1.1rem 0 0; }
    .note ul { margin: 0.35rem 0 0; padding-left: 1.15rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>UmaTools寄せ：色の組み合わせ</h1>
    <p class="lead">
      構成はすべて B（画像なし・細いナビ・カード）。色だけ変えています。本体は未着手。
      帯との比較は <a href="./layout-band-vs-umatoo.html">こちら</a>。
      机のCSS下地は <a href="./umatoo-bg-texture.html">こちら</a>。
    </p>

    <div class="grid" id="grid"></div>

    <div class="note">
      おすすめの読み方
      <ul>
        <li><strong>夜の金ピンク</strong> — UmaToolsに最も近い。リッチ。長時間だとコントラストが強い</li>
        <li><strong>明るい計算機</strong> — リストと数字が一番読める。sp-calc の白カードに近いが、壁紙がないので別物</li>
        <li><strong>暗い帽子＋白い机</strong> — 額縁はリッチ、作業は明るい。ツールとして無難で、個人的には本命になりやすい</li>
        <li><strong>暖色の夜</strong> — ピンクを抑えて因子・紙の比喩。暗いリッチの別解</li>
      </ul>
    </div>
  </div>

  <template id="ui">
    <header class="nav">
      <h2>継承白因子<em>リスト</em></h2>
      <button type="button" class="help">使い方</button>
    </header>
    <div class="main">
      <section class="card">
        <h3>場 / 距離 / 脚質</h3>
        <div class="chips">
          <span class="chip on">東京</span>
          <span class="chip">中山</span>
          <span class="chip">阪神</span>
        </div>
        <div class="chips" style="margin-top:0.35rem">
          <span class="chip on">芝 1600 左</span>
          <span class="chip">芝 2000 左</span>
          <span class="chip on">先行</span>
        </div>
      </section>
      <section class="card">
        <h3>先頭25件</h3>
        <div class="row"><span>直線巧者</span><span>0.35 バ</span></div>
        <div class="row"><span>コーナー回復○</span><span>0.22 バ</span></div>
        <div class="row"><span>末脚</span><span>0.18 バ</span></div>
        <button type="button" class="copy">先頭25件をコピー</button>
      </section>
    </div>
  </template>

  <script>
    const items = [
      {
        theme: "night",
        title: "1. 夜の金ピンク",
        cap: "いまのB。暗い作業面、金の下線、ピンクのコピー。UmaToolsに一番近い。",
      },
      {
        theme: "calc",
        title: "2. 明るい計算機",
        cap: "壁紙なしの明るい机。紫インクのチップ、金の見出し。数字向き。",
      },
      {
        theme: "hybrid",
        title: "3. 暗い帽子＋白い机",
        cap: "ナビだけ夜。本文は白カード。リッチと読みやすさの折衷。",
      },
      {
        theme: "warm",
        title: "4. 暖色の夜",
        cap: "ピンクを赤金に寄せる。因子・紙の比喩。暗いリッチの別解。",
      },
    ];
    const tpl = document.getElementById("ui").content;
    const grid = document.getElementById("grid");
    for (const item of items) {
      const fig = document.createElement("figure");
      fig.innerHTML = "<figcaption>" + item.title + "<span>" + item.cap + "</span></figcaption>";
      const frame = document.createElement("div");
      frame.className = "frame";
      frame.dataset.theme = item.theme;
      frame.appendChild(tpl.cloneNode(true));
      fig.appendChild(frame);
      grid.appendChild(fig);
    }
  </script>
</body>
</html>
